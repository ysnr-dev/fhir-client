# Render Blueprint(無料枠)。backend は Docker、frontend は静的サイト。
# DB は Neon(無料・無期限)を外部利用する。
# 手順は fhir-server リポジトリの docs/DEPLOY_RENDER.md を参照。
services:
  # --- Rails backend(FHIR プロキシ + 国内マスタ API) ---
  - type: web
    name: ysnr-fhir-client-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile.production
    dockerContext: ./backend
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      # Neon の接続文字列(?sslmode=require 付き)。ダッシュボードで設定する。
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      # 管理画面(/admin)のセッション Cookie の署名鍵。credentials 経由
      # (= RAILS_MASTER_KEY 依存)にすると鍵未設定で管理画面が 500 になるので、
      # Render に生成させて env で明示的に渡す。値が変わると既存の管理セッションは
      # 失効するだけで、DB の暗号化データ(AR_ENCRYPTION_* 由来)には影響しない。
      - key: SECRET_KEY_BASE
        generateValue: true
      # fhir-server 側で `rails fhir:register_client` した client_id / client_secret。
      - key: FHIR_SERVER_CLIENT_ID
        sync: false
      - key: FHIR_SERVER_CLIENT_SECRET
        sync: false
      # fhir-server の実ホスト名に合わせる(名前衝突サフィックスに注意)。
      - key: FHIR_SERVER_BASE_URL
        value: https://ysnr-fhir-server.onrender.com
      # 接続設定 UI の client_secret を暗号化して DB 保存するための鍵。
      # `bin/rails db:encryption:init` で生成し、ダッシュボードで設定する。
      - key: AR_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: AR_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      # 管理画面 (/admin/*) のパスフレーズ。設定すると管理UIはログインを要求し
      # (HttpOnly セッション Cookie)、API 直叩きは Bearer / X-Admin-Token を要求する。
      # OAuth クライアント管理画面を使う場合は必須(未設定なら本番では 503 で閉じる)。
      # 生成例: openssl rand -hex 32
      - key: ADMIN_TOKEN
        sync: false
      # 上流 fhir-server の FHIR_ADMIN_TOKEN と同じ値。OAuth クライアントの
      # 一覧・登録・削除に使う。接続設定画面から DB に保存する運用が主なので、
      # ここは env フォールバック(未設定でも構わない)。
      - key: FHIR_ADMIN_TOKEN
        sync: false

  # --- React SPA(Vite ビルドの静的配信) ---
  # /fhir・/master は rewrite で backend にプロキシし同一オリジン化する
  # (フロントは相対パス固定・backend に CORS 設定がないため必須)。
  - type: web
    name: ysnr-fhir-client
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # トランザクション Bundle は末尾セグメントの無い /fhir ちょうどに POST される
      # (postBundle → fetch("/fhir"))。/fhir/* だけだとこれが SPA フォールバックに
      # 落ちて index.html が 200 で返り、処方登録が backend に届かない。exact も必要。
      - type: rewrite
        source: /fhir
        destination: https://ysnr-fhir-client-api.onrender.com/fhir
      - type: rewrite
        source: /fhir/*
        destination: https://ysnr-fhir-client-api.onrender.com/fhir/*
      - type: rewrite
        source: /master
        destination: https://ysnr-fhir-client-api.onrender.com/master
      - type: rewrite
        source: /master/*
        destination: https://ysnr-fhir-client-api.onrender.com/master/*
      # 休眠したサーバーを明示的に起こすエンドポイント(ヘッダーの起こしボタン)。
      # backend に届くこと自体が backend の起動トリガーになる。
      - type: rewrite
        source: /wakeup
        destination: https://ysnr-fhir-client-api.onrender.com/wakeup
      # 接続設定(管理)API。無いと SPA フォールバックに落ちて index.html が返る。
      - type: rewrite
        source: /admin
        destination: https://ysnr-fhir-client-api.onrender.com/admin
      - type: rewrite
        source: /admin/*
        destination: https://ysnr-fhir-client-api.onrender.com/admin/*
      # アプリ本体のログイン(/auth/session)と医療従事者ログインアカウント管理。
      - type: rewrite
        source: /auth
        destination: https://ysnr-fhir-client-api.onrender.com/auth
      - type: rewrite
        source: /auth/*
        destination: https://ysnr-fhir-client-api.onrender.com/auth/*
      # 帳票出力(レイアウト照会 + QuestionnaireResponse の PDF)。exact + /* の
      # 両方が必要なのは /fhir と同じ理由。
      - type: rewrite
        source: /reports
        destination: https://ysnr-fhir-client-api.onrender.com/reports
      - type: rewrite
        source: /reports/*
        destination: https://ysnr-fhir-client-api.onrender.com/reports/*
      # 検体ラベルの台帳(発行・到着状況)。exact + /* の両方が必要なのは /fhir と同じ理由。
      - type: rewrite
        source: /lab_labels
        destination: https://ysnr-fhir-client-api.onrender.com/lab_labels
      - type: rewrite
        source: /lab_labels/*
        destination: https://ysnr-fhir-client-api.onrender.com/lab_labels/*
      # SPA フォールバック(react-router の直リンク対応)
      - type: rewrite
        source: /*
        destination: /index.html
