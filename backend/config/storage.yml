# DICOM の実体の置き場(docs/imaging-design.md)。
local:
  service: Disk
  root: <%= ENV.fetch("ACTIVE_STORAGE_ROOT") { Rails.root.join("storage") } %>

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# Backblaze B2(S3 互換)。endpoint と region はバケットの詳細画面に出る値
# (例: s3.us-east-005.backblazeb2.com / us-east-005)。access_key_id はアプリケーション
# キーの keyID、secret_access_key は applicationKey。
# checksum の 2 行は、aws-sdk-s3 が既定で付ける CRC32 を S3 以外が受け付けないため。
b2:
  service: S3
  endpoint: <%= ENV["B2_ENDPOINT"] %>
  access_key_id: <%= ENV["B2_KEY_ID"] %>
  secret_access_key: <%= ENV["B2_APPLICATION_KEY"] %>
  bucket: <%= ENV["B2_BUCKET"] %>
  region: <%= ENV["B2_REGION"] %>
  force_path_style: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
